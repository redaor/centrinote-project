# 🚀 Déploiement manuel minimaliste pour Netlify
# Objectif : 0 crédit consommé tant que pas de déploiement en prod
# Déclenchement : UNIQUEMENT sur tag `release`

name: Deploy to Netlify (Manual)

on:
  push:
    tags:
      - 'release*'  # Exemple : git tag release-v1.0.0 && git push origin release-v1.0.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔨 Build project
        run: npm run build
        env:
          # Ajoutez vos variables d'environnement ici si nécessaire
          # VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          # VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: 🚀 Deploy to Netlify
        uses: netlify/actions/cli@master
        with:
          args: deploy --prod --dir=dist
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: ✅ Déploiement terminé
        run: echo "✅ Déploiement terminé ! Coût : ~15 crédits Netlify"

