# Configuration Netlify pour CentriNote - Production
# =======================================================================

[build]
  command = "npm run build"
  publish = "dist"
  environment = { NODE_ENV = "production", NODE_VERSION = "18", NPM_FLAGS = "--production=false" }

[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = """default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://meet.jit.si https://8x8.vc https://*.jitsi.net https://*.jitsi.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://meet.jit.si https://8x8.vc https://*.jitsi.net; font-src 'self' https://fonts.gstatic.com https://meet.jit.si https://8x8.vc; img-src 'self' data: https: blob:; connect-src 'self' https://*.supabase.co https://api.supabase.co https://www.googleapis.com https://accounts.google.com https://oauth2.googleapis.com https://n8n.srv886297.hstgr.cloud https://zoom.us https://api.zoom.us https://us02web.zoom.us https://meet.jit.si https://8x8.vc https://*.jitsi.net https://*.jitsi.org wss://meet.jit.si wss://8x8.vc wss://*.jitsi.net; frame-src 'self' https://accounts.google.com https://zoom.us https://us02web.zoom.us https://meet.jit.si https://8x8.vc https://*.jitsi.net https://*.jitsi.org; media-src 'self' blob: data: https://meet.jit.si https://8x8.vc https://*.jitsi.net; worker-src 'self' blob: https://meet.jit.si https://8x8.vc;"""
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=*, microphone=*, display-capture=*, autoplay=*, encrypted-media=*, geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/auth/confirm-email"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/auth/confirm-signup"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/zoom/callback"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/google-meet/callback"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/auth/callback"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"
  
[functions.environment]
  NODE_ENV = "production"

[dev]
  command = "npm run dev"
  port = 5173

# Plugins optionnels - Commentés pour éviter les erreurs
# ========================================================

# Pour activer plus tard si besoin :
# [[plugins]]
#   package = "netlify-plugin-compress"

# [[plugins]]
#   package = "netlify-plugin-image-optim"

[build.processing.images]
  compress = true

[context.production]
  environment = { NODE_ENV = "production" }

[context.deploy-preview]
  environment = { NODE_ENV = "preview" }

[context.branch-deploy]
  environment = { NODE_ENV = "staging" }