[build]
  command = "npm run build"
  publish = "dist"
  # Ignorer les fichiers .md lors du déploiement (déjà exclus par Vite)
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- '*.md'"

[build.environment]
  NODE_VERSION = "18"
  NPM_CONFIG_PRODUCTION = "false"

# Configuration pour les fonctions serverless
[functions]
  # Timeout par défaut (10s) suffisant pour transcription via API

  # Variables par fonction (limite usage pour réduire taille)
  [functions."transcribe-audio"]
    included_files = []

  [functions."get-recording-url"]
    included_files = []

  [functions."end-meeting"]
    included_files = []

  # Fonctions qui utilisent utils/emailTemplates
  [functions."send-summary-email"]
    included_files = ["utils/**"]

  [functions."send-invites-batch"]
    included_files = ["utils/**"]

  [functions."create-meeting-v3"]
    included_files = ["utils/**"]

  [functions."create-meeting-v2"]
    included_files = ["utils/**"]

  [functions."create-meeting"]
    included_files = ["utils/**"]

  [functions."test-smtp"]
    included_files = ["utils/**"]

# Redirection spécifique pour /launch (doit être avant le catch-all)
[[redirects]]
  from = "/launch"
  to = "/launch.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev"
  # Port retiré : Netlify Dev détectera automatiquement le port de Vite (5173)
  # Si vous avez besoin d'un port spécifique, utilisez: port = 8888 (port par défaut de Netlify Dev)
  publish = "dist"

# Exception CSP pour /launch.html (DOIT être AVANT la règle globale)
# Autorise tous les CDN nécessaires pour la landing page
[[headers]]
  for = "/launch.html"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self' https://cdn.tailwindcss.com https://unpkg.com https://cdnjs.cloudflare.com https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://unpkg.com https://cdnjs.cloudflare.com; script-src-elem 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://unpkg.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com https://cdn.tailwindcss.com; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com https://cdn.tailwindcss.com; img-src 'self' data: blob: https:; connect-src 'self' https:; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'self';"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), display-capture=()"

# Headers pour la sécurité (pour toutes les autres pages)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Content Security Policy pour autoriser images base64, Supabase, Daily.co, CDN externes (launch page) et scripts inline
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: blob: https://*.supabase.co https://*.supabase.in https://*.daily.co; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.daily.co https://cdn.tailwindcss.com https://unpkg.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://*.daily.co https://unpkg.com https://fonts.googleapis.com; connect-src 'self' https://*.supabase.co https://*.supabase.in https://api.openai.com https://*.daily.co wss://*.supabase.co wss://*.supabase.in wss://*.daily.co; font-src 'self' data: https://*.daily.co https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'self' https://*.daily.co;"
    Permissions-Policy = "camera=(self \"https://*.daily.co\"), microphone=(self \"https://*.daily.co\"), geolocation=(), display-capture=(self \"https://*.daily.co\")"

# Cache pour les assets statiques
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Edge Functions - Daily.co Webhooks
[[edge_functions]]
  path = "/.netlify/functions/daily-recording-ready"
  function = "daily-recording-ready"

[[edge_functions]]
  path = "/daily-webhook-test"
  function = "daily-webhook-test"

# Scheduled Functions - Auto-end meetings after duration
[functions."check-meetings-duration"]
  schedule = "*/5 * * * *"  # Toutes les 5 minutes