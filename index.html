<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <!-- PERF: Preconnect aux domaines externes pour réduire la latence DNS/TLS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://supabase.co" />

    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO: Description et métadonnées -->
    <meta name="description" content="Centrinote - Plateforme tout-en-un pour gérer vos notes, réunions et vocabulaire avec l'intelligence artificielle. Notes intelligentes, réunions avec résumés IA, apprentissage de langues optimisé." />
    <meta name="keywords" content="centrinote, gestion connaissances, notes IA, réunions virtuelles, apprentissage langues, vocabulaire, résumés automatiques, productivité" />
    <meta name="author" content="Centrinote" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://centrinote.fr/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://centrinote.fr/" />
    <meta property="og:title" content="Centrinote - Plateforme de gestion des connaissances avec IA" />
    <meta property="og:description" content="Notes intelligentes, réunions + résumé, vocabulaire auto, automations. Tout-en-un pour votre productivité." />
    <meta property="og:site_name" content="Centrinote" />
    <meta property="og:locale" content="fr_FR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://centrinote.fr/" />
    <meta name="twitter:title" content="Centrinote - Plateforme de gestion des connaissances avec IA" />
    <meta name="twitter:description" content="Notes intelligentes, réunions + résumé, vocabulaire auto, automations. Tout-en-un pour votre productivité." />

    <!-- JSON-LD: Structured Data pour Google Rich Results -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Centrinote",
      "url": "https://centrinote.fr",
      "logo": "https://centrinote.fr/image/logo.png",
      "sameAs": [
        "https://www.linkedin.com/company/centrinote",
        "https://twitter.com/centrinote"
      ]
    }
    </script>

    <title>Centrinote - Plateforme de gestion des connaissances avec IA | Notes, Réunions, Vocabulaire</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Conteneurs dédiés pour éviter les collisions de portails -->
    <div id="modals"></div>
    <div id="toasts"></div>
    <div id="notifs"></div>

    <!-- PERF: Script principal chargé en module pour supporter le code-splitting -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
